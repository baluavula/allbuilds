apiVersion: v1
kind: Namespace
metadata:
  name: login-ns
apiVersion: apps/v1
kind: Deployement
metadata: 
  name: login-ms-deploy
  namespace: login-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: login
    template:
      metadata:
        labels: 
          app: login
      spec:
        containers:
          - image: nginx
            name: cont-nginx
            ports:
              - contaianerPort:80
  
---
apiVersion: v1
kind: Service
metadata:
  name: login-ms-svc
  namespace: login-ns
spec:
  type: CLusterIP
  selector:
    app: login
  ports:
   - port: 80
     containerPort: 8080
---
apiVersion: nerworking.k8s.io/v1
kind: Ingress
metadata: 
  name: login-ms-ingress
  namespace: login-ns
spec:
  rules:
    - host:
      http:
        - paths:
            path: /
            pathtype: prefix
            backend:
              service:
                name: login-ms-svc
                port:
                  number: 8080
          
    

